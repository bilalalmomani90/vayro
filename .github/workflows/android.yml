name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

# contents: write لنشر ملف APK كإصدار تجريبي (لا يستهلك حصة المرفقات)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # يوفر أمر gradle بإصدار ثابت (لا يوجد gradle wrapper في المستودع بعد)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      # يحدّث PROJECT_INFO.txt بوقت البناء الفعلي بعد نجاح الاختبارات والبناء فقط
      - name: Update PROJECT_INFO.txt
        if: success()
        run: bash scripts/update_project_info.sh SUCCESS PASSED

      # المرفقات تستهلك حصة تخزين الحساب (APK مع GeckoView كبير)، لذلك:
      # يوم واحد فقط، والـ APK فقط، ولا يُفشل البناء كله إن امتلأت الحصة
      - uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: vayro-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

      # الطريقة الأساسية للحصول على الملف: إصدار تجريبي واحد يُستبدل في كل بناء ناجح على main
      - name: Publish latest debug APK as a pre-release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug "$APK" PROJECT_INFO.txt \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "VAYRO debug (build ${{ github.run_number }})" \
            --notes "Debug build from commit ${{ github.sha }}. Unit tests passed."
